      <tspan x="13" y="43">#############</tspan>
      <tspan x="13" y="53">## ## ### ###</tspan>
      <tspan x="13" y="63">## ## ### ###</tspan>
      <tspan x="13" y="73">## ## ### ###</tspan>
      <tspan x="13" y="83"> ########### </tspan>
    </text>
  </svg>
